name: Native release builds

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub Release tag to receive the build files
        required: true
        default: v0.1.8
        type: string
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
  EXPO_PUBLIC_BASE_URL: /

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: --mac --universal --x64 --arm64
            artifact: macOS
          - os: windows-2025
            target: --win
            artifact: Windows
          - os: ubuntu-24.04
            target: --linux
            artifact: Linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run typecheck
      - run: npm run build:desktop
      - name: Package desktop application
        run: npm --workspace apps/desktop run dist -- ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: GuideLens-${{ matrix.artifact }}
          path: apps/desktop/release/*
          if-no-files-found: error
      - name: Attach desktop files to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_tag }}
          files: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.tar.gz

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Apply ONNX Runtime Gradle 9 compatibility patch
        run: node apps/mobile/scripts/patch-onnx-gradle.mjs
      - run: npx expo prebuild --platform android --no-install
        working-directory: apps/mobile
      - run: ./gradlew assembleDebug
        working-directory: apps/mobile/android
      - name: Name installable APK
        run: cp apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk GuideLens-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: GuideLens-Android
          path: GuideLens-Android.apk
          if-no-files-found: error
      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_tag }}
          files: GuideLens-Android.apk

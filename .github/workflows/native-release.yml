name: Native release builds

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
  EXPO_PUBLIC_BASE_URL: /

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
            artifact: macOS
          - os: windows-latest
            target: --win
            artifact: Windows
          - os: ubuntu-latest
            target: --linux
            artifact: Linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:desktop
      - name: Package desktop application
        run: npm --workspace apps/desktop run dist -- ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: GuideLens-${{ matrix.artifact }}
          path: apps/desktop/release/*
          if-no-files-found: error
      - name: Attach desktop files to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
        working-directory: apps/mobile
      - run: ./gradlew assembleDebug
        working-directory: apps/mobile/android
      - name: Name installable APK
        run: cp apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk GuideLens-0.1.0-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: GuideLens-Android
          path: GuideLens-0.1.0-Android.apk
          if-no-files-found: error
      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: GuideLens-0.1.0-Android.apk

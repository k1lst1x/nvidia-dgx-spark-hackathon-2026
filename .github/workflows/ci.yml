name: CI
on: [pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: npm install
      - run: echo "c789161ed43c8269fcd4e67c67eeeb4e80c622da2eb296a20bc6007bd18a0b7d  apps/mobile/assets/models/yolox_nano.onnx" | sha256sum --check
      - run: npm run typecheck
      - run: npm run build:web
      - run: pip install -r apps/api/requirements-dev.txt
      - run: pytest apps/api/tests
        env:
          PYTHONPATH: apps/api

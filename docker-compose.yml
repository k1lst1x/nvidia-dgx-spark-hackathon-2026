services:
  api:
    build: ./apps/api
    ports: ["8000:8000"]
    environment:
      MOCK_INFERENCE: "true"
      CORS_ORIGINS: "http://localhost:8081"
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
